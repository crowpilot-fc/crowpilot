name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAFETY mirror in sync
        run: diff SAFETY.md docs/safety.md
      - name: DISCLAIMER mirror in sync
        run: diff DISCLAIMER.md docs/disclaimer.md
      - name: CHANGELOG mirror in sync
        run: diff CHANGELOG.md docs/changelog.md

  deploy:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
