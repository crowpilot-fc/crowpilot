site_name: CrowPilot
site_description: Open-source flight controller firmware for the Raspberry Pi RP2350.
site_url: https://crowpilot-fc.github.io/crowpilot/
repo_url: https://github.com/crowpilot-fc/crowpilot
repo_name: crowpilot-fc/crowpilot
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
  palette:
    - scheme: default
      primary: black
      accent: deep orange
    - scheme: slate
      primary: black
      accent: deep orange

nav:
  - Home: index.md
  - Getting Started:
    - What is CrowPilot: getting-started/what-is-crowpilot.md
    - Hardware BOM: getting-started/hardware-bom.md
    - Wiring: getting-started/wiring.md
    - Flashing: getting-started/flashing.md
    - First Bench Test: getting-started/first-bench-test.md
  - User Guide:
    - Arming and Failsafe: user-guide/arming-and-failsafe.md
    - Transmitter Setup: user-guide/transmitter-setup.md
    - Flight Modes: user-guide/flight-modes.md
    - Tuning: user-guide/tuning.md
    - Calibration: user-guide/calibration.md
    - Reading Logs: user-guide/reading-logs.md
    - Writing a User Sketch: user-guide/user-sketch.md
  - Airframes:
    - Tailsitter Bicopter: airframes/tailsitter-bicopter.md
    - Fixed-Wing Plane: airframes/fixed-wing-plane.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Algorithms: developer-guide/algorithms.md
    - Adding a Board: developer-guide/adding-a-board.md
    - Adding an Airframe: developer-guide/adding-an-airframe.md
    - Coding Standards: developer-guide/coding-standards.md
  - Reference:
    - Config Options: reference/config-options.md
    - Pin Maps: reference/pin-maps.md
    - Telemetry Format: reference/telemetry-format.md
  - Safety: safety.md
  - Disclaimer: disclaimer.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true
